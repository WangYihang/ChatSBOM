# requires-python is >=3.12. The hooks that read Python, autopep8,
# add-trailing-comma and double-quote-string-fixer among them, read it
# with the interpreter they run on, so they run on the version we target
# rather than whatever pre-commit picks up.
default_language_version:
    python: python3.12

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        # Compose's `!reset`, which a loader other than compose's has no
        # constructor for: that file is parsed below instead.
        exclude: ^docker-compose\.tunnel\.yaml$
    -   id: check-yaml
        name: check yaml syntax (compose's tags)
        # Parsed for its syntax without constructing its values, which
        # `!reset` would stop. compose_test reads it as compose does.
        args: [--unsafe]
        files: ^docker-compose\.tunnel\.yaml$
    -   id: debug-statements
    -   id: double-quote-string-fixer
    -   id: name-tests-test
    -   id: check-json
    -   id: pretty-format-json
        args: [--autofix, --indent=4]
        # schema.json is generated from chatsbom/export/schema.py:
        # reformatted here, the checked-in copy differs from the
        # generator's output. package-lock.json is npm's: re-sorted here,
        # every `npm install` put it back in npm's order, a diff each time.
        # tests/fixtures/syft-*.json are Syft's, byte for byte: indented
        # and sorted, their descriptor is no longer near the end, where
        # the tests read it from.
        exclude: ^(web/(src/schema\.json|package-lock\.json)|tests/fixtures/syft-[^/]*\.json)$
-   repo: local
    hooks:
    # The ruff the dev group pins, with pyproject.toml's configuration, as
    # `uv run ruff check` runs it. It does what flake8, autoflake,
    # reorder-python-imports and pyupgrade did, each at a version of its
    # own. It lints and does not format: autopep8 and add-trailing-comma,
    # after it so that they format what its fixes write, format the tree
    # until `ruff format` replaces them. `--force-exclude` holds the files
    # pre-commit names to the excludes ruff's own walk keeps to.
    -   id: ruff
        name: ruff
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
-   repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    -   id: shellcheck
-   repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
    -   id: hadolint
-   repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
    -   id: actionlint
        # actionlint runs shellcheck over each `run:` script when it can
        # find it, and in the hook's own environment it could not.
        additional_dependencies: [shellcheck-py==0.11.0.1]
-   repo: local
    hooks:
    # The mypy the dev group pins, in the project's own environment and
    # with pyproject.toml's configuration, so a commit and CI run the same
    # check. The mirrors-mypy hook ran another version, over other files,
    # in an environment without the project's dependencies, in which
    # every import from them was Any.
    -   id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
