[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatsbom"
version = "0.5.4"
description = "ChatSBOM - Talk to your Supply Chain. Chat with SBOMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yihang Wang", email = "wangyihanger@gmail.com" }]
keywords = ["sbom", "supply-chain", "dependencies", "clickhouse", "syft"]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "clickhouse-connect>=0.7.16",
    "requests>=2.32.5",
    "rich>=14.3.2",
    "typer>=0.21.1",
    "structlog>=24.0.0",
    "requests-cache>=1.3.0",
    "gitpython>=3.1.46",
    "pyyaml>=6.0.3",
    "humanize>=4.15.0",
    # Imported directly, by the models and by core/client.py's retries.
    # Undeclared, they came with other packages, pydantic with the LLM
    # stack, which is an extra now.
    "pydantic>=2.0.0",
    "urllib3>=1.26.0",
]

# What only some commands use, so that installing chatsbom, and the
# collector's image, which runs none of them, takes none of it. Without
# its extra, a command says which to install (chatsbom/core/extras.py).
[project.optional-dependencies]
chat = [
    # `tools`, which `chat` sets to none, came in 0.1.12. 0.1.53 to
    # 0.1.59 dropped `setting_sources=[]` as falsy, and their CLI read
    # the user's and the project's settings, hooks and permission rules.
    "claude-agent-sdk>=0.1.12,!=0.1.53,!=0.1.54,!=0.1.55,!=0.1.56,!=0.1.57,!=0.1.58,!=0.1.59",
    "textual>=7.5.0",
]
classify = [
    "instructor>=1.14.5",
    "openai>=2.24.0",
]
openapi = [
    "pandas>=2.0.0",
    "tiktoken>=0.8.0",
]
export = [
    "pyarrow>=25.0.1",
]
all = [
    "chatsbom[chat,classify,export,openapi]",
]

[dependency-groups]
dev = [
    # Every extra: the suite covers every command, so it imports pandas,
    # pyarrow and textual, and a plain `uv sync` should make an
    # environment it runs in. `--no-dev` is the core alone.
    "chatsbom[all]",
    # The build backend, so that the suite can build the sdist as `uv
    # build` does, in-process and offline (tests/sdist_test.py).
    "hatchling>=1.32.4",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[project.scripts]
chatsbom = "chatsbom.__main__:app"

# What the sdist takes: the package, what building its wheel reads, and
# the citation. Told nothing, hatchling took the repository, 40 MB of
# recordings, dashboard and deployment (#28). Not tests/: they read
# compose, the Dockerfiles, web/ and deploy/, so they run in a checkout
# only. `only-include` walks these paths alone, where `include` would
# filter a walk of the whole tree, dataset and node_modules included.
# Set for the sdist alone: the wheel keeps its default, the package.
# scripts/check_sdist.py checks the result.
[tool.hatch.build.targets.sdist]
only-include = [
    "chatsbom",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "data",
    ".cache",
    ".requests-cache",
    ".workspaces",
    "database",
    "figures",
    "experiments",
    ".git",
]
addopts = "-ra --strict-markers --strict-config"
python_files = ["*_test.py", "test_*.py"]

[tool.mypy]
python_version = "3.12"
files = ["chatsbom"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# The data contract and the layers that enforce it are held to strict
# typing. The rest of the tree is being brought up to this bar module by
# module; the ratchet only tightens.
[[tool.mypy.overrides]]
module = [
    "chatsbom.core.manifest",
    "chatsbom.core.repository",
    "chatsbom.core.schema",
    "chatsbom.core.table",
    "chatsbom.models.query",
    "chatsbom.models.relationship",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[tool.bump-my-version.files]
"pyproject.toml" = [
    'project.version'
]
