[build-system]
# 1.27 is the first to read `license-files` as a list (PEP 639). An older
# backend, left in a cache, would build different metadata without a
# word; with the bound it fails instead.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatsbom"
version = "0.5.4"
description = "ChatSBOM - Talk to your Supply Chain. Chat with SBOMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yihang Wang", email = "wangyihanger@gmail.com" }]
keywords = ["sbom", "supply-chain", "dependencies", "clickhouse", "syft"]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "clickhouse-connect>=0.7.16",
    "requests>=2.32.5",
    "rich>=14.3.2",
    "typer>=0.21.1",
    "structlog>=24.0.0",
    # 1.3.2 is the first that can save a response under requests 2.34,
    # which the floor above admits: 1.3.0 and 1.3.1 raise NameError on
    # `RequestsCookieJar`.
    "requests-cache>=1.3.2",
    "gitpython>=3.1.46",
    "pyyaml>=6.0.3",
    "humanize>=4.15.0",
    # Imported directly, by the models and by core/client.py's retries.
    # Undeclared, they came with other packages, pydantic with the LLM
    # stack, which is an extra now.
    "pydantic>=2.0.0",
    "urllib3>=1.26.0",
]

# What only some commands use, so that installing chatsbom, and the
# collector's image, which runs none of them, takes none of it. Without
# its extra, a command says which to install (chatsbom/core/extras.py).
[project.optional-dependencies]
chat = [
    # 0.2.111 is the first with `CanUseToolShadowedWarning`, which `chat`
    # silences by its category (chat_agent.build_options). That is past
    # what it needed before: `tools`, which `chat` sets to none, came in
    # 0.1.12, and 0.1.53 to 0.1.59 dropped `setting_sources=[]` as falsy,
    # and their CLI read the user's and the project's settings, hooks and
    # permission rules.
    "claude-agent-sdk>=0.2.111",
    "textual>=7.5.0",
]
classify = [
    "instructor>=1.14.5",
    "openai>=2.24.0",
]
openapi = [
    "pandas>=2.0.0",
    "tiktoken>=0.8.0",
]
export = [
    "pyarrow>=25.0.1",
]
# The web service, `web serve` (#134), and nothing the collector runs.
web = [
    # ALTCHA's own library, for the proof of work a question carries.
    # 2.1.0 is the first whose verification holds a solution to the
    # signed key prefix: 2.0.x took the key derived for any counter, so
    # a solution that had done no work at all was verified.
    "altcha>=2.1.0",
    # The service, and the server it runs on. Starlette is FastAPI's
    # own, named for what `server.app` takes from it directly: the ASGI
    # types, the static files and the headers of a response in flight.
    # Each floor is the release the tests ran on.
    "fastapi>=0.142.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]
all = [
    "chatsbom[chat,classify,export,openapi,web]",
]

[dependency-groups]
dev = [
    # Every extra: the suite covers every command, so it imports pandas,
    # pyarrow and textual, and a plain `uv sync` should make an
    # environment it runs in. `--no-dev` is the core alone.
    "chatsbom[all]",
    # The build backend, so that the suite can build the sdist as `uv
    # build` does, in-process and offline (tests/sdist_test.py).
    "hatchling>=1.32.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    # What Starlette's TestClient is built on, for the web service's
    # tests. openai and the Claude Agent SDK bring it too, but not for
    # that.
    "httpx2>=2.13.1",
    # The one mypy, which CI and the pre-commit hook both run, with its
    # stubs. Pinned exactly: a new release of either can fail the check
    # with no change here, so each one comes as its own update.
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260914",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20260906",
    # The one ruff, which the pre-commit hook runs, on a commit and in CI,
    # and `uv run ruff check` too. Pinned exactly: a new release can fail
    # the lint with no change here, so it comes as its own update.
    "ruff==0.16.9",
    # README's `uv run pre-commit run -a`.
    "pre-commit>=4.6.2",
]

[project.scripts]
chatsbom = "chatsbom.__main__:app"

# What the sdist takes: the package, what building its wheel reads, and
# the citation. Told nothing, hatchling took the repository, 40 MB of
# recordings, dashboard and deployment (#28). Not tests/: they read
# compose, the Dockerfiles, web/ and deploy/, so they run in a checkout
# only. `only-include` walks these paths alone, where `include` would
# filter a walk of the whole tree, dataset and node_modules included.
# Set for the sdist alone: the wheel keeps its default, the package.
# scripts/check_sdist.py checks the result.
[tool.hatch.build.targets.sdist]
only-include = [
    "chatsbom",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "data",
    ".cache",
    ".requests-cache",
    ".workspaces",
    "database",
    "figures",
    "experiments",
    ".git",
]
addopts = "-ra --strict-markers --strict-config"
python_files = ["*_test.py", "test_*.py"]
# `--strict-markers` refuses any marker not named here. `clickhouse` is
# the one the suite uses, through `requires_clickhouse`
# (tests/conftest.py). There is no `network` marker, because no test
# may use the network: the git tests read repositories on disk.
markers = [
    "clickhouse: needs a live ClickHouse; skipped without one, failed in CI",
]
# What a test opens, it closes: a file, a socket, a process it waits
# for, and a SQLite connection, which Python warns of from 3.13 on.
# `with sqlite3.connect(...)` does not close one; it ends a transaction.
# Most of these are found by the garbage collector, whose warning comes
# out of a finalizer as an unraisable exception, so that is an error
# too. The collector may find one in a later test than the test that
# left it open; PYTHONTRACEMALLOC=20 says where it was opened.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
# `pytest --cov`, as CI runs it, measures the package.
source = ["chatsbom"]

[tool.coverage.report]
skip_covered = true
# A floor, a little under the 86.75% the whole suite measured with
# ClickHouse when it was set: a change that drops tests, or adds code no
# test reaches, fails `pytest --cov`. Raise it as coverage rises.
fail_under = 85

[tool.mypy]
python_version = "3.12"
# What `uv run mypy` checks, from CI and from the pre-commit hook alike.
files = ["chatsbom", "scripts", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# The data contract and the layers that enforce it are held to strict
# typing. The rest of the tree is being brought up to this bar module by
# module; the ratchet only tightens.
[[tool.mypy.overrides]]
module = [
    "chatsbom.commands.queue.due",
    "chatsbom.core.catalog",
    "chatsbom.core.due",
    "chatsbom.core.manifest",
    "chatsbom.core.repository",
    "chatsbom.core.schema",
    "chatsbom.core.table",
    "chatsbom.models.query",
    "chatsbom.models.relationship",
    "chatsbom.server.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

# What `uv run ruff check` checks, and the pre-commit hook with it: what
# the four hooks it replaced checked, flake8, autoflake,
# reorder-python-imports and pyupgrade. It lints; autopep8,
# add-trailing-comma and double-quote-string-fixer go on formatting the
# tree until `ruff format` takes over, which would rewrite nearly every
# file.
#
# Nothing is excluded: ruff skips what git ignores, the dataset and the
# workspaces among it, and no directory pytest skips holds a Python file
# git tracks.
[tool.ruff]
target-version = "py312"
# pycodestyle's limit, to which autopep8 wraps the tree. E501 is ignored,
# as flake8 ignored it, so the length decides only where an import that
# does not fit is wrapped.
line-length = 79

[tool.ruff.lint]
select = [
    # flake8's: pyflakes, and pycodestyle's errors and warnings. F401's
    # fix removes an unused import, as autoflake did.
    "F",
    "E",
    "W",
    # autoflake's other removal, a `pass` its block does not need.
    "PIE790",
    # reorder-python-imports', in its style (below).
    "I",
    # pyupgrade's, and those of its rewrites ruff files under other codes:
    # set literals, dict comprehensions, and `list` or `dict` for a
    # defaultdict's lambda.
    "UP",
    "C401",
    "C402",
    "C403",
    "C404",
    "C405",
    "PIE807",
]
ignore = [
    # Long lines, which flake8 ignored too: autopep8 shortens what it can.
    "E501",
    # Rewrites pyupgrade does not make, left for the pass that modernises
    # the tree. `datetime.UTC` for `timezone.utc`: pyupgrade rewrites only
    # `datetime.timezone.utc`, which the tree does not write.
    "UP017",
    # `.format()` for any `%`: pyupgrade rewrites one only with a tuple or
    # a dict after it, and leaves the tree's, which ruff cannot rewrite
    # safely either.
    "UP031",
    # PEP 695's `type` statement and type parameters.
    "UP040",
    "UP046",
    "UP047",
    # StrEnum for a subclass of `str` and `Enum`, which changes what
    # `str()` of a member returns.
    "UP042",
]

# reorder-python-imports' style, in which the tree is written: a `from`
# import names one thing, and within a section the order is alphabetical
# whatever the case, where isort's default puts constants and classes
# first.
[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
known-first-party = ["chatsbom"]

# A release: `uvx bump-my-version bump patch` (or `minor`, `major`) on a
# clean tree, then commit, tag the commit `v<version>` and push the tag;
# .github/workflows/release.yaml publishes it once the tests pass, and
# refuses a tag that is not this version.
#
# The version is written once, as `project.version` above: with no
# `current_version` here, bump-my-version reads it from there and
# writes it back. Every other place that states it is a `files` entry
# below, and tests/version_test.py fails on one that is not. uv.lock
# names it too, so the bump ends by running `uv lock`, which rewrites
# chatsbom's own entry there; commit that with the rest.
#
# README's images stay on `main` on purpose, not on the release's tag.
# README is the repository's front page as well as PyPI's, and a pinned
# URL would show the last release's image there, and nothing at all for
# one added since, until the next release. The cost is that a release's
# PyPI page shows the images `main` has, so a figure is added under a
# new name rather than renamed or removed.
[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = ["uv lock"]
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

# The provenance line the dashboard shows under compose.
[[tool.bumpversion.files]]
filename = "docker-compose.yaml"
search = "chatsbom/{current_version} clickhouse"
replace = "chatsbom/{new_version} clickhouse"
