[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatsbom"
version = "0.5.4"
description = "ChatSBOM - Talk to your Supply Chain. Chat with SBOMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pygithub>=2.8.1",
    "clickhouse-connect>=0.7.16",
    "ratelimit>=2.2.1",
    "requests>=2.32.5",
    "rich>=14.3.2",
    "typer>=0.21.1",
    "structlog>=24.0.0",
    "requests-cache>=1.3.0",
    "claude-agent-sdk>=0.1.0",
    "prompt_toolkit>=3.0.0",
    "mcp>=1.26.0",
    "pandas>=2.0.0",
    "clickhouse-connect>=0.7.0",
    "textual>=7.5.0",
    "gitpython>=3.1.46",
    "matplotlib>=3.10.8",
    "pyyaml>=6.0.3",
    "humanize>=4.15.0",
    "tiktoken>=0.8.0",
    "litellm>=1.81.15",
    "instructor>=1.14.5",
    "openai>=2.24.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[project.scripts]
chatsbom = "chatsbom.__main__:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "data",
    ".cache",
    ".requests-cache",
    ".workspaces",
    "database",
    "figures",
    "experiments",
    ".git",
]
addopts = "-ra --strict-markers --strict-config"
python_files = ["*_test.py", "test_*.py"]

[tool.mypy]
python_version = "3.12"
files = ["chatsbom"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# The data contract and the layers that enforce it are held to strict
# typing. The rest of the tree is being brought up to this bar module by
# module; the ratchet only tightens.
[[tool.mypy.overrides]]
module = [
    "chatsbom.core.manifest",
    "chatsbom.core.repository",
    "chatsbom.core.schema",
    "chatsbom.core.table",
    "chatsbom.models.query",
    "chatsbom.models.relationship",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[tool.bump-my-version.files]
"pyproject.toml" = [
    'project.version'
]
