<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatSBOM</title>

</head>
<body>
  <header>
    <h1>ChatSBOM</h1>
    <p class="tagline">Who actually depends on what, across open source.</p>
  </header>

  <main>
    <section id="search">
      <label for="package">Package</label>
      <input id="package" type="search" placeholder="mail, express, gin&hellip;"
             autocomplete="off" spellcheck="false">
      <label class="toggle">
        <input id="direct-only" type="checkbox">
        Declared dependencies only
      </label>
    </section>

    <section id="status" aria-live="polite">Loading dataset&hellip;</section>

    <section id="results" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">Repository</th>
            <th scope="col" class="num">Stars</th>
            <th scope="col">Version</th>
            <th scope="col">Depends</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section id="ask">
      <h2>Ask a question</h2>
      <p class="hint">
        Answered by a model that can only call the same typed queries this
        page uses — there is no SQL escape hatch.
      </p>
      <form id="ask-form">
        <input id="question" type="text" autocomplete="off"
               placeholder="Which projects actually declare a dependency on mail?">
        <button type="submit">Ask</button>
      </form>
      <div id="trace" aria-live="polite"></div>
      <div id="answer"></div>
    </section>
  </main>

  <footer id="dataset-info"></footer>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
