name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release calls this, and publishes only if every job here passes.
  workflow_call:

# Read the code and nothing else. Each job says so again for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, the release named beside it: a tag can
# be moved to other code. Dependabot moves the pins.
#
# Each setup-uv installs the uv the collector's image copies
# (Dockerfile), which it names: without a version it took the newest,
# and CI locked and synced with another uv than the image. Nothing
# moves either by itself, so workflows_test holds them together.
jobs:
  # The suite on the oldest Python pyproject.toml declares, and on the
  # one the collector's image runs (Dockerfile).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Each Python's result, whatever the other's: a failure on one
      # does not cancel the other.
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `python-version` is UV_PYTHON for every uv command after this,
      # so `uv sync` makes the environment with this leg's Python, not
      # .python-version's.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: true
          python-version: ${{ matrix.python }}

      # The syft the collector's image installs (Dockerfile): its amd64
      # archive, from the release, checked against the digest the image
      # pins for it (workflows_test holds the two together). Without one
      # the SBOM tests skip, and here a skip fails the run.
      - name: Install syft
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin syft
          syft version

      - name: Install dependencies
        run: uv sync --locked

      # The whole suite, and the coverage floor in pyproject.toml.
      # Actions sets CI, and with it a skip fails the run
      # (tests/conftest.py): everything a test needs is provided here.
      - name: Run tests
        run: uv run pytest --cov

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every hook, with the pre-commit the dev group installs. mypy is
      # one of them: the version the dev group pins, over what
      # pyproject.toml names, so a commit and CI run the same check.
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node the web service's image builds the page on
      # (Dockerfile.web).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: true

      - run: npm ci

      # `npm run schema` runs chatsbom through `uv run`.
      - name: Install Python dependencies
        run: uv sync --locked

      # src/schema.ts is generated from chatsbom/export/schema.py. If
      # regenerating changes it, the checked-in copy is stale and the
      # dashboard is typed against a contract that no longer exists.
      - name: Types are up to date with the Python schema
        run: |
          npm run schema
          git diff --exit-code src/schema.ts src/schema.json

      - run: npm run typecheck

      # ESLint's and TypeScript's recommended rules and the rules of
      # hooks (eslint.config.js). Unused names are tsc's, above.
      - run: npm run lint

      # Chart hues came out of a validator, not out of taste. Without this
      # step a future colour edit would ship with no check at all.
      - run: npm run validate:palette

      - run: npm test

      - run: npm run build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'

      - run: uv build

      # The package alone: with no list of what to take, the sdist was
      # the whole repository, 40 MB of it (#28).
      - name: Check the sdist's contents
        run: python3 scripts/check_sdist.py dist/*.tar.gz

      # twine alone, in a tool environment of its own: reading two
      # archives needs none of the project's dependencies, which
      # `uv run --with twine` installed first.
      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*

  # Each image, from each Dockerfile and each target: a broken FROM, a
  # digest the registry no longer serves, or a COPY of something the
  # build context lacks fails here, where no test can see it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the collector image
        run: docker build --target collector --tag chatsbom-collector .

      - name: Build the lock image
        run: docker build --target lock --tag chatsbom-lock .

      # What `docker build` makes with no target, the collector again.
      - name: Build the default target
        run: docker build --tag chatsbom-default .

      - name: Build the web service's image
        run: docker build --file Dockerfile.web --tag chatsbom-web .

      - name: The images start
        run: |
          docker run --rm chatsbom-collector --help
          docker run --rm --entrypoint docker chatsbom-lock --version

      # Hatchling leaves the licence out of the wheel, without a word,
      # when LICENSE is not in the build context (#28).
      - name: The installed chatsbom carries its licence
        run: |
          docker run --rm --entrypoint python chatsbom-collector -c '
          from importlib.metadata import distribution
          dist = distribution("chatsbom")
          declared = dist.metadata.get_all("License-File") or []
          shipped = [str(f) for f in dist.files or () if f.name == "LICENSE"]
          print("License-File:", declared, "files:", shipped)
          assert declared == ["LICENSE"] and shipped
          '

  # What a fresh clone gets from `docker compose up -d`. Only here can a
  # start be watched: nothing else in this repository has a Docker
  # daemon.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every profile's services, interpolated with nothing set, no .env
      # and no token, as on a fresh clone: an unset variable that a
      # service needs, or a malformed one, fails here rather than at up.
      - name: The compose file reads, for every profile
        run: docker compose --profile '*' config --quiet

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'

      # What README has a fresh clone publish before the web service
      # starts: a snapshot of the store, empty on a fresh clone, where
      # the service reads it. Without one the service does not start, and
      # without data/snapshots compose refuses to create it. Without
      # --no-dev, every extra would be installed for commands that need
      # none.
      - name: A snapshot, as a fresh clone publishes one
        run: |
          mkdir -p data/snapshots
          uv run --locked --no-dev chatsbom warehouse build
          uv run --locked --no-dev chatsbom snapshot build

      # The web service, built and waited for until its healthcheck says
      # it answers, with the key it does not start without.
      - name: A fresh clone comes up healthy
        run: |
          ALTCHA_HMAC_KEY="$(openssl rand -hex 32)" \
            docker compose up --detach --wait --wait-timeout 600

      - name: The services' logs
        if: ${{ !cancelled() }}
        run: docker compose logs
