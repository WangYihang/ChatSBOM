services:
  clickhouse:
    # The LTS release, pinned by digest as every image here is. README's
    # `docker run` and the CLI's hint name the same release (compose_test).
    image: clickhouse/clickhouse-server:26.8-alpine@sha256:6d7f6c28dcc30f7aad4ea2e0d0b52a7bc5dde54df2b08aa3fcb4b0eeb461ba89
    # Bound to the loopback interface, not every interface.
    #
    # `"8123:8123"` publishes on 0.0.0.0, which put the HTTP interface on
    # the LAN — and `admin` carries access_management=1, so the password
    # `admin` was the only thing between any host on the network and an
    # account that can create users and grant anything. Measured: a plain
    # `curl --user admin:admin http://<lan-ip>:8123/` answered.
    #
    # This breaks nothing. The compose services reach the server as
    # `clickhouse:8123` over the compose network, which host publishing
    # has no part in, and a host-side `chatsbom` run connects to
    # 127.0.0.1. It does mean a deliberate `-p` or an SSH tunnel is now
    # required to reach it from elsewhere, which is the point.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./database/data:/var/lib/clickhouse
      - ./database/config/users.d:/etc/clickhouse-server/users.d
      # Server settings, as opposed to account settings. Only `users.d`
      # was mounted, so there was nowhere to bound the server's own
      # logs: `system.trace_log_0` reached 15.26 GiB across 888 million
      # rows, against 3.02 GiB for the dataset it was describing.
      #
      # One file, not the directory. Mounting `config.d` itself hides
      # the image's own `docker_related_config.xml`, which is where
      # `<listen_host>0.0.0.0</listen_host>` comes from -- without it
      # the server binds the container's loopback only, stays healthy
      # to its in-container healthcheck, and refuses every connection
      # from the host.
      - ./database/config/config.d/logs.xml:/etc/clickhouse-server/config.d/logs.xml
    environment:
      CLICKHOUSE_DB: chatsbom
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the image localhost resolves to
      # ::1 first and the server is not listening there, so the probe is
      # refused while the port is perfectly reachable.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Everything depends on this, and it had no restart policy while
    # `web` and `collector` did. A Docker daemon restart therefore
    # brought the dashboard back without its database: the site stayed
    # up, answered every query with a 500, and the container read
    # `Exited (0)` — a clean shutdown, so nothing looked broken except
    # the page.
    restart: unless-stopped

  # Continuous collection, containerised so it leaves nothing on the host.
  #
  #   docker compose --profile collect up -d     start
  #   docker compose logs -f collector           watch
  #   docker compose down                        gone, no host installs
  #
  # Not started by default: it spends GitHub rate budget, so enabling it
  # should be a decision rather than a side effect of `compose up`.
  collector:
    profiles: ["collect"]
    # One image for the collector and `cli`, built from the `collector`
    # stage of Dockerfile. Named for their services, they were two images
    # of the same sources, each built on its own; sharing a name,
    # whichever is built first serves the other. Named after the project,
    # as compose names what it builds, so that two checkouts on one host
    # still build an image each.
    image: ${COMPOSE_PROJECT_NAME}-collector
    # Built here and published nowhere. With the default policy compose
    # asks Docker Hub for a named image before building it, and warns
    # when that fails; this builds a missing one without asking.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # Reached over the compose network, not localhost.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: chatsbom
      # From `.env`, as the CLI on the host takes them: written in here, a
      # password changed in database/config/users.d and `.env` never
      # reached the containers, which went on sending the old one.
      CLICKHOUSE_ADMIN_USER: "${CLICKHOUSE_ADMIN_USER:-admin}"
      CLICKHOUSE_ADMIN_PASSWORD: "${CLICKHOUSE_ADMIN_PASSWORD:-admin}"
      # Passed on as it is, empty when unset; the loop refuses to start
      # without it, and says why in `docker compose logs collector`. A
      # `${GITHUB_TOKEN:?...}` here was checked on every command, since
      # compose interpolates the whole file whichever profiles are on:
      # without a token, `up`, `ps` and `down` all refused.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-900}"
      SYNC_SLICE: "${SYNC_SLICE:-500}"
      SYNC_QUOTA: "${SYNC_QUOTA:-250}"
      RUN_LIMIT: "${RUN_LIMIT:-50}"
      RUN_QUOTA: "${RUN_QUOTA:-400}"
      # How `run` fetches dependency graphs; `.env.example` says what each
      # choice does. Set in `.env` and not handed on here, it would change
      # the CLI on the host and not the collector.
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      PRUNE_EVERY_SLICES: "${PRUNE_EVERY_SLICES:-96}"
      PRUNE_KEEP: "${PRUNE_KEEP:-2}"
      INDEX_EVERY_SLICES: "${INDEX_EVERY_SLICES:-96}"
      GENERATE_LIMIT: "${GENERATE_LIMIT:-all}"
      # Logs as JSON, one object per line on stderr, for whatever
      # collects them. Written here, not taken from `.env`: there it sets
      # how the CLI on the host logs, for a person, as `cli` does here.
      CHATSBOM_LOG_FORMAT: json
    # Runs as the invoking user, not the image's baked-in uid: data/ and
    # .cache/ are bind mounts owned by whoever cloned the repo, and a
    # mismatched uid makes the ledger a read-only database. Put UID/GID in
    # the .env beside this file: bash holds UID read-only, so exporting a
    # value for it fails.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # The same paths a manual run uses, so switching between the
      # container and the host loses no progress.
      #
      # Make them before the first `up`: Docker creates a missing source
      # owned by root, which this uid cannot write. The loop checks, and
      # refuses to start with the fix in its log.
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache
      - ./deploy/collector-loop.sh:/app/collector-loop.sh:ro
    entrypoint: ["/bin/sh", "/app/collector-loop.sh"]
    # docker-init as PID 1, passing the stop signal to the loop's shell.
    # The kernel ignores a signal sent to PID 1 that has no handler for
    # it, so the shell there, with no trap, ignored every stop: each one
    # waited out the grace period and ended in SIGKILL, slice in flight
    # and all. The loop traps TERM now and hands it on to that slice, and
    # under an init it is not PID 1 either, so a signal it has no trap
    # for does what it would anywhere else.
    init: true
    restart: unless-stopped
    # One pathological repository must not take the host with it.
    mem_limit: 4g
    cpus: 2.0

  # The dependency-graph worker, beside the collector: the same image,
  # mounts and loop, run as `collector-loop.sh depgraph`. A service of
  # its own because GitHub meters the dependency graph apart, at 100 to
  # 200 requests an hour per token, and its endpoint closes after
  # 2026-11-13: it runs at that bucket's pace, all the time, instead of
  # once per collector slice. Every token in CHATSBOM_DEPGRAPH_TOKENS
  # adds a worker beside GITHUB_TOKEN's.
  #
  #   docker compose --profile collect up -d     starts both
  #   docker compose logs -f depgraph            watch
  depgraph:
    profiles: ["collect"]
    image: ${COMPOSE_PROJECT_NAME}-collector
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # More tokens, comma-separated; `.env.example` says how.
      CHATSBOM_DEPGRAPH_TOKENS: "${CHATSBOM_DEPGRAPH_TOKENS:-}"
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      DEPGRAPH_LIMIT: "${DEPGRAPH_LIMIT:-200}"
      DEPGRAPH_RATE: "${DEPGRAPH_RATE:-90}"
      DEPGRAPH_INTERVAL_SECONDS: "${DEPGRAPH_INTERVAL_SECONDS:-300}"
      # As the collector's.
      CHATSBOM_LOG_FORMAT: json
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache
      - ./deploy/collector-loop.sh:/app/collector-loop.sh:ro
    entrypoint: ["/bin/sh", "/app/collector-loop.sh", "depgraph"]
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  # A Docker daemon for `sbom lock`, so resolving a lockfile needs nothing
  # on the host either.
  #
  # Rootless on purpose. `sbom lock` runs an ecosystem's own resolver — a
  # Gemfile is Ruby, a POM runs build plugins — so the question is where
  # an escape lands. Mounting the host socket would put it on the host
  # daemon, which is host root. Here it lands inside this container, whose
  # own root maps to an unprivileged host uid, and `compose down` destroys
  # it.
  #
  # ./data is mounted here as well as on `lock`, at the *same path*, on
  # purpose: a container this daemon starts resolves a bind mount against
  # *its own* filesystem, so a path the lock service can see but the
  # daemon cannot would silently mount nothing. Read-only: a resolver
  # reads the project and sends its lockfile back on stdout, and `lock`
  # writes it, so nothing the daemon runs has cause to write here.
  #
  # On a network of its own with `lock`, and nothing else. It was on the
  # default network, serving its API in plain TCP on 2375 with no
  # authentication: every service there, the internet-facing `web`
  # included, could start any container on it, and a resolver reached
  # what the daemon reaches, ClickHouse's `admin` among it. Now the API
  # is TLS on 2376, and answers only a client holding the certificate
  # the daemon made, which only `lock` has.
  dind:
    profiles: ["lock"]
    # Pinned by digest, as the recipes' images are (core/sandbox.py).
    image: docker:29-dind-rootless@sha256:1f029db43a32fbb1465fe8ff4327d405154876946986170e97d7861232a8227a
    privileged: true
    environment:
      # The image's entrypoint makes a CA, a server certificate and a
      # client one here at every start, as the rootless user, and serves
      # the API on tcp://0.0.0.0:2376 with --tlsverify. The CA's key
      # stays in this container; only client/ is shared.
      DOCKER_TLS_CERTDIR: /certs
      # The server certificate names the container's hostname, `docker`
      # and `localhost`, and compose leaves the hostname a container id:
      # `lock` dials `dind`, and would refuse a certificate without it.
      DOCKER_TLS_SAN: "DNS:dind"
    networks: [sandbox]
    volumes:
      - dind-storage:/home/rootless/.local/share/docker
      - dind-certs:/certs/client
      - ./data:/app/data:ro
    healthcheck:
      # As `lock` connects: over TLS, with the client certificate. The
      # address is the loopback's, which the certificate names too.
      test:
        - CMD
        - docker
        - --host=tcp://127.0.0.1:2376
        - --tlsverify
        - --tlscacert=/certs/client/ca.pem
        - --tlscert=/certs/client/cert.pem
        - --tlskey=/certs/client/key.pem
        - info
      interval: 10s
      timeout: 5s
      retries: 18

  # Resolve lockfiles for projects that ship none. Deliberately not part
  # of the collector loop: it is expensive, and it runs project-controlled
  # code, so it should be a decision each time.
  #
  #   docker compose --profile lock run --rm lock sbom lock --ecosystem composer
  lock:
    profiles: ["lock"]
    build:
      context: .
      dockerfile: Dockerfile
      # The collector's stage and a Docker client; see Dockerfile.
      target: lock
    # chatsbom is PID 1 otherwise, and has no handler for the TERM a stop
    # sends, which the kernel ignores for PID 1: every stop waited out the
    # grace period and ended in SIGKILL.
    init: true
    depends_on:
      dind:
        condition: service_healthy
    environment:
      # TLS both ways: this client checks the daemon's certificate, and
      # the daemon this client's.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    # The daemon's network alone. `sbom lock` reads data/ and never
    # connects to ClickHouse, so it is given neither an account nor a
    # route to one.
    networks: [sandbox]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      # The client certificate, and its key, which the image's entrypoint
      # leaves readable by any uid: `lock` runs as the invoking user, not
      # as the daemon's.
      - dind-certs:/certs/client:ro
    entrypoint: ["chatsbom"]

  # The dashboard. Reaches ClickHouse by service name over the compose
  # network, so the database needs no host port for the site to work.
  #
  # `wrangler dev` is a development server; see the note in
  # Dockerfile.web. It is not meant to be reached from the internet
  # directly: the way in is a tunnel, a `cloudflared` outside this
  # project that reaches the port published below (README, "Putting it
  # on the internet"). There is no tunnel service here.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    # docker-init as PID 1, as for the collector, cli and lock: it hands
    # a stop to the entrypoint, which passes it on to wrangler. Neither
    # the entrypoint nor wrangler, which it execs when WATCHDOG_DISABLED
    # is set, is then PID 1, where the kernel drops any signal a process
    # has no handler for.
    init: true
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # `clickhouse`, not 127.0.0.1: inside a container the loopback is
      # the container's own. This is the one line that has to change
      # from the host setup and the one most likely to be missed.
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: chatsbom
      CLICKHOUSE_USER: guest
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_GUEST_PASSWORD:-guest}"
      # The provenance line under the page: this release, and the store
      # that answers. A fact about the build rather than a setting, so
      # not taken from `.env`; a bump rewrites it (pyproject.toml).
      GENERATOR: chatsbom/0.5.4 clickhouse
      # Optional. Without it /api/chat answers "AI answers are not
      # configured on this deployment" rather than failing oddly.
      #
      # This, the password above and TURNSTILE_SECRET reach the Worker
      # through a mode-0600 `.dev.vars` the entrypoint writes at start,
      # not the command line, where any user on the host could read them.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Optional, and a pair, from one widget in the Cloudflare dashboard.
      # With the secret set, every question must first pass a Turnstile
      # challenge, which the page shows with the site key (DEPLOY.md).
      # The secret without the site key refuses every question. The site
      # key is public, and reaches the Worker on its command line.
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      # Optional. When set, the Worker believes CF-Connecting-IP, which
      # both rate limiters key on, only on a request carrying it as
      # X-Edge-Secret: the header a Cloudflare Transform Rule adds for
      # the site (DEPLOY.md). Any other request, one that reached 8787
      # directly, shares one bucket whatever address it claims. Unset,
      # the header is taken on trust, as it always was.
      EDGE_SECRET: "${EDGE_SECRET:-}"
      DAILY_SPEND_CAP_USD: "${DAILY_SPEND_CAP_USD:-5}"
      # The image sets these too. Here as well because `up` without
      # `--build` reuses whatever image there is, and one built before
      # those lines must still start with the explorer off and without
      # filling the state volume with traces. Why, in Dockerfile.web.
      X_LOCAL_EXPLORER: "false"
      X_LOCAL_OBSERVABILITY: "false"
      # The container watches itself, because a wedged Worker does not
      # exit and `restart: unless-stopped` only fires on exit — see the
      # note in deploy/web-entrypoint.sh for the outage that showed it.
      WATCHDOG_INTERVAL_SECONDS: "${WATCHDOG_INTERVAL_SECONDS:-30}"
      WATCHDOG_FAILURES: "${WATCHDOG_FAILURES:-4}"
      WATCHDOG_TIMEOUT_SECONDS: "${WATCHDOG_TIMEOUT_SECONDS:-20}"
      WATCHDOG_GRACE_SECONDS: "${WATCHDOG_GRACE_SECONDS:-60}"
      # Set to any value to go back to a bare `wrangler dev`.
      WATCHDOG_DISABLED: "${WATCHDOG_DISABLED:-}"
    volumes:
      # wrangler's local state, which holds the spend counter
      # DAILY_SPEND_CAP_USD is checked against. In the container layer
      # it went with every recreate — `up --build` included — and the
      # day's cap reset with it. `docker compose down -v` still clears it.
      - web-state:/app/web/.wrangler/state
    # Published on all interfaces by default, so a `cloudflared`
    # container outside this compose project can reach it via
    # `host.docker.internal`, which resolves to the host gateway rather
    # than to loopback — a `127.0.0.1` binding is invisible from there.
    #
    # On Linux that name needs to be granted explicitly; the tunnel
    # container wants:
    #
    #     --add-host host.docker.internal:host-gateway
    #
    # All interfaces includes the LAN, and a client that reaches 8787
    # directly rather than through the tunnel sets the headers the tunnel
    # would have: `CF-Connecting-IP`, which the rate limiters key on,
    # among them, unless EDGE_SECRET above is set. WEB_BIND=172.17.0.1
    # publishes it on the docker bridge alone — that is its address on a
    # default install; `ip -4 addr show docker0` says for certain.
    ports:
      - "${WEB_BIND:-0.0.0.0}:8787:8787"
    healthcheck:
      # Asserts *which* backend answered, not just that something did.
      #
      # The first version checked `repositories > 0` and passed while
      # the container served a seven-month-old D1 snapshot: `--var` was
      # missing, so the Worker saw no ClickHouse binding, and a stale
      # `.wrangler` directory in the image supplied the fallback. A
      # healthy container serving February's numbers is worse than a
      # failing one.
      #
      # `meta()` names its own store — `clickhouse (live)` against
      # `d1 v5` — so that is the thing to check.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8787/api/q',{method:'POST',
          headers:{'content-type':'application/json'},
          body:'{\"method\":\"meta\"}'}).then(r=>r.json())
          .then(m=>process.exit(/clickhouse/.test(m.schemaVersion)?0:1))
          .catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  # A one-shot shell in the same image, for running a stage by hand:
  #
  #   docker compose run --rm cli queue status
  #   docker compose run --rm cli db index --repos-file /app/data/pilot.txt
  #
  # Same image and mounts as the collector, so a manual stage and the
  # loop see identical state.
  cli:
    profiles: ["tools"]
    # The collector's image, and so the collector's build; see there.
    image: ${COMPOSE_PROJECT_NAME}-collector
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    # As for `lock`: chatsbom as PID 1 would ignore the TERM a stop sends.
    init: true
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: chatsbom
      # Both accounts, as the CLI on the host has them: `db index` and
      # `export` connect as admin, `db query` and `db status` as guest.
      CLICKHOUSE_ADMIN_USER: "${CLICKHOUSE_ADMIN_USER:-admin}"
      CLICKHOUSE_ADMIN_PASSWORD: "${CLICKHOUSE_ADMIN_PASSWORD:-admin}"
      CLICKHOUSE_GUEST_USER: "${CLICKHOUSE_GUEST_USER:-guest}"
      CLICKHOUSE_GUEST_PASSWORD: "${CLICKHOUSE_GUEST_PASSWORD:-guest}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # As the collector has it, for `github depgraph` and `run` by hand.
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      CHATSBOM_DEPGRAPH_TOKENS: "${CHATSBOM_DEPGRAPH_TOKENS:-}"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache

networks:
  # The nested daemon and `lock`, and nothing else: not ClickHouse, not
  # `web`, not the collector. Not `internal`, since the daemon pulls the
  # recipes' images and a resolver fetches from its registry: resolution
  # is that. Beyond it a resolver reaches what the host does; egress is
  # not limited to the registries.
  sandbox:

volumes:
  # The nested daemon's image cache. A named volume rather than a bind
  # mount: it holds overlay2 layers, which need a real filesystem.
  dind-storage:
  # The nested daemon's client certificate, which it writes and `lock`
  # alone reads. Named, so that Docker fills it from the image's
  # /certs/client, which is mode 1777: the daemon runs rootless, and a
  # directory made by Docker would be root's.
  dind-certs:
  # The dashboard's wrangler state. A named volume rather than a bind
  # mount: Docker creates it from the image's directory, owned by the
  # uid the Worker runs as, where a host directory would be owned by
  # whoever made it.
  web-state:
