services:
  # Continuous collection, containerised so it leaves nothing on the host.
  #
  #   docker compose --profile collect up -d     start
  #   docker compose logs -f collector           watch
  #   docker compose down                        gone, no host installs
  #
  # Not started by default: it spends GitHub rate budget, so enabling it
  # should be a decision rather than a side effect of `compose up`.
  collector:
    profiles: ["collect"]
    # One image for the collector and `cli`, built from the `collector`
    # stage of Dockerfile. Named for their services, they were two images
    # of the same sources, each built on its own; sharing a name,
    # whichever is built first serves the other. Named after the project,
    # as compose names what it builds, so that two checkouts on one host
    # still build an image each.
    image: ${COMPOSE_PROJECT_NAME}-collector
    # Built here and published nowhere. With the default policy compose
    # asks Docker Hub for a named image before building it, and warns
    # when that fails; this builds a missing one without asking.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    environment:
      # Passed on as it is, empty when unset; the loop refuses to start
      # without it, and says why in `docker compose logs collector`. A
      # `${GITHUB_TOKEN:?...}` here was checked on every command, since
      # compose interpolates the whole file whichever profiles are on:
      # without a token, `up`, `ps` and `down` all refused.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-900}"
      SYNC_SLICE: "${SYNC_SLICE:-500}"
      SYNC_QUOTA: "${SYNC_QUOTA:-250}"
      RUN_LIMIT: "${RUN_LIMIT:-50}"
      RUN_QUOTA: "${RUN_QUOTA:-400}"
      # How `run` fetches dependency graphs; `.env.example` says what each
      # choice does. Set in `.env` and not handed on here, it would change
      # the CLI on the host and not the collector.
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      PRUNE_EVERY_SLICES: "${PRUNE_EVERY_SLICES:-96}"
      PRUNE_KEEP: "${PRUNE_KEEP:-2}"
      INDEX_EVERY_SLICES: "${INDEX_EVERY_SLICES:-96}"
      GENERATE_LIMIT: "${GENERATE_LIMIT:-all}"
      WAREHOUSE: "${WAREHOUSE:-on}"
      EXPORT_INTERVAL_SECONDS: "${EXPORT_INTERVAL_SECONDS:-604800}"
      # What DuckDB may hold and run, within this container's 4 GiB and
      # two CPUs, below: each index pass builds the warehouse and a
      # snapshot of it, and the loop exports it weekly (#150). The
      # fallbacks are the code's own defaults, which DEPLOY.md's table
      # and `.env.example` show too: tests hold the four to one value.
      CHATSBOM_DUCKDB_MEMORY_LIMIT: "${CHATSBOM_DUCKDB_MEMORY_LIMIT:-2GiB}"
      CHATSBOM_DUCKDB_THREADS: "${CHATSBOM_DUCKDB_THREADS:-2}"
      # Logs as JSON, one object per line on stderr, for whatever
      # collects them. Written here, not taken from `.env`: there it sets
      # how the CLI on the host logs, for a person, as `cli` does here.
      CHATSBOM_LOG_FORMAT: json
    # Runs as the invoking user, not the image's baked-in uid: data/ and
    # .cache/ are bind mounts owned by whoever cloned the repo, and a
    # mismatched uid makes the ledger a read-only database. Put UID/GID in
    # the .env beside this file: bash holds UID read-only, so exporting a
    # value for it fails.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # The same paths a manual run uses, so switching between the
      # container and the host loses no progress.
      #
      # Make them before the first `up`: Docker creates a missing source
      # owned by root, which this uid cannot write. The loop checks, and
      # refuses to start with the fix in its log.
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache
      - ./deploy/collector-loop.sh:/app/collector-loop.sh:ro
    entrypoint: ["/bin/sh", "/app/collector-loop.sh"]
    # docker-init as PID 1, passing the stop signal to the loop's shell.
    # The kernel ignores a signal sent to PID 1 that has no handler for
    # it, so the shell there, with no trap, ignored every stop: each one
    # waited out the grace period and ended in SIGKILL, slice in flight
    # and all. The loop traps TERM now and hands it on to that slice, and
    # under an init it is not PID 1 either, so a signal it has no trap
    # for does what it would anywhere else.
    init: true
    restart: unless-stopped
    # One pathological repository must not take the host with it.
    mem_limit: 4g
    cpus: 2.0

  # The dependency-graph worker, beside the collector: the same image,
  # mounts and loop, run as `collector-loop.sh depgraph`. A service of
  # its own because GitHub meters the dependency graph apart, at 100 to
  # 200 requests an hour per token, and its endpoint closes after
  # 2026-11-13: it runs at that bucket's pace, all the time, instead of
  # once per collector slice. Every token in CHATSBOM_DEPGRAPH_TOKENS
  # adds a worker beside GITHUB_TOKEN's.
  #
  #   docker compose --profile collect up -d     starts both
  #   docker compose logs -f depgraph            watch
  depgraph:
    profiles: ["collect"]
    image: ${COMPOSE_PROJECT_NAME}-collector
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # More tokens, comma-separated; `.env.example` says how.
      CHATSBOM_DEPGRAPH_TOKENS: "${CHATSBOM_DEPGRAPH_TOKENS:-}"
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      DEPGRAPH_LIMIT: "${DEPGRAPH_LIMIT:-200}"
      DEPGRAPH_RATE: "${DEPGRAPH_RATE:-90}"
      DEPGRAPH_INTERVAL_SECONDS: "${DEPGRAPH_INTERVAL_SECONDS:-300}"
      # As the collector's.
      CHATSBOM_LOG_FORMAT: json
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache
      - ./deploy/collector-loop.sh:/app/collector-loop.sh:ro
    entrypoint: ["/bin/sh", "/app/collector-loop.sh", "depgraph"]
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  # A Docker daemon for the resolver, so resolving a lockfile needs
  # nothing on the host either.
  #
  # Rootless on purpose. `sbom lock` runs an ecosystem's own resolver — a
  # Gemfile is Ruby, a POM runs build plugins — so the question is where
  # an escape lands. Mounting the host socket would put it on the host
  # daemon, which is host root. Here it lands inside this container, whose
  # own root maps to an unprivileged host uid, and `compose down` destroys
  # it.
  #
  # ./data is mounted here as well as on `resolver`, at the *same path*,
  # on purpose: a container this daemon starts resolves a bind mount
  # against *its own* filesystem, so a path the resolver can see but the
  # daemon cannot would silently mount nothing. Read-only: a resolution
  # reads the project and sends its lockfile back on stdout, and the
  # resolver writes it, so nothing the daemon runs has cause to write
  # here.
  #
  # On a network of its own with `resolver`, and nothing else. It was on
  # the default network, serving its API in plain TCP on 2375 with no
  # authentication: every service there, the internet-facing `web`
  # included, could start any container on it, and a resolver reached
  # what the daemon reaches, ClickHouse's `admin` among it. Now the API
  # is TLS on 2376, and answers only a client holding the certificate
  # the daemon made, which only `resolver` has.
  #
  # Inside it each resolution runs on a network of the daemon's own,
  # internal, whose one way out is a proxy to the recipe's registries
  # (chatsbom/core/sandbox.py): what a resolution runs reaches
  # repo.packagist.org, packagist.org, rubygems.org or
  # index.rubygems.org, on 443, and nothing else, this network included.
  dind:
    profiles: ["lock"]
    # Pinned by digest, as the recipes' images are (core/sandbox.py).
    image: docker:29-dind-rootless@sha256:1f029db43a32fbb1465fe8ff4327d405154876946986170e97d7861232a8227a
    privileged: true
    environment:
      # The image's entrypoint makes a CA, a server certificate and a
      # client one here at every start, as the rootless user, and serves
      # the API on tcp://0.0.0.0:2376 with --tlsverify. The CA's key
      # stays in this container; only client/ is shared.
      DOCKER_TLS_CERTDIR: /certs
      # The server certificate names the container's hostname, `docker`
      # and `localhost`, and compose leaves the hostname a container id:
      # the resolver dials `dind`, and would refuse a certificate
      # without it.
      DOCKER_TLS_SAN: "DNS:dind"
    networks: [sandbox]
    volumes:
      - dind-storage:/home/rootless/.local/share/docker
      - dind-certs:/certs/client
      - ./data:/app/data:ro
    healthcheck:
      # As the resolver connects: over TLS, with the client certificate.
      # The address is the loopback's, which the certificate names too.
      test:
        - CMD
        - docker
        - --host=tcp://127.0.0.1:2376
        - --tlsverify
        - --tlscacert=/certs/client/ca.pem
        - --tlscert=/certs/client/cert.pem
        - --tlskey=/certs/client/key.pem
        - info
      interval: 10s
      timeout: 5s
      retries: 18

  # The resolver (#168): `sbom lock` as a service beside the collector,
  # with none of its tokens. It resolves a lockfile for each directory of
  # the store that ships none, at its repository's current commit, as the
  # collector makes them due, the most-starred repositories first; each
  # in a container of the nested daemon, whose one way out is a proxy to
  # the recipe's registries. It keeps what failed in data/resolver.sqlite,
  # with a backoff, and sleeps CHATSBOM_RESOLVE_INTERVAL while nothing is
  # due.
  #
  #   docker compose --profile lock up -d            start it, and its daemon
  #   docker compose logs -f resolver                watch
  #   docker compose --profile lock stop resolver    stop it
  #
  # Behind its profile, so that `up` starts it only when asked: it runs
  # project-controlled code. One process writes resolver.sqlite, so a pass
  # by hand, `run --rm resolver sbom lock --once`, is refused while the
  # service runs: stop it first (DEPLOY.md).
  resolver:
    profiles: ["lock"]
    build:
      context: .
      dockerfile: Dockerfile
      # The collector's stage and a Docker client; see Dockerfile.
      target: lock
    # chatsbom is PID 1 otherwise, and has no handler for the TERM a stop
    # sends, which the kernel ignores for PID 1: every stop waited out the
    # grace period and ended in SIGKILL.
    init: true
    depends_on:
      dind:
        condition: service_healthy
    environment:
      # TLS both ways: this client checks the daemon's certificate, and
      # the daemon this client's.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # How long it sleeps while nothing is due; `.env.example` says how
      # to say one. The fallback is the code's own.
      CHATSBOM_RESOLVE_INTERVAL: "${CHATSBOM_RESOLVE_INTERVAL:-1h}"
      # As the collector's: JSON, one object per line on stderr, for
      # whatever collects the logs.
      CHATSBOM_LOG_FORMAT: json
      # And nothing else: no GitHub token, no key. What it runs is
      # project-controlled, and it asks GitHub nothing.
    # The daemon's network alone. `sbom lock` reads data/ and asks no
    # other service anything, so it is given a route to none.
    networks: [sandbox]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      # The client certificate, and its key, which the image's entrypoint
      # leaves readable by any uid: the resolver runs as the invoking
      # user, not as the daemon's.
      - dind-certs:/certs/client:ro
    entrypoint: ["chatsbom"]
    command: ["sbom", "lock"]
    restart: unless-stopped
    # A stop cancels each resolution in flight: its container is removed,
    # then its proxy and its network, which takes the daemon a few
    # seconds, and nothing is left half-written. Docker's 10 s would
    # leave it little room under `--workers`.
    stop_grace_period: 30s

  # The tunnel, as a service of this project: a remotely managed named
  # tunnel, whose routes the Cloudflare dashboard holds, run with its
  # token from `.env` (DEPLOY.md). Its route is the site's hostname to
  # `http://web:8080`, over `edge`; any other hostname gets the
  # catch-all the dashboard keeps at the end, `http_status:404`.
  #
  #   COMPOSE_FILE=docker-compose.yaml:docker-compose.tunnel.yaml   in .env
  #   TUNNEL_TOKEN=<the tunnel's token>                             in .env
  #   docker compose up -d                                  from this directory
  #   docker compose ps                                     both healthy
  #
  # Behind a profile, so that `up` starts it only when asked: it puts the
  # site on the internet. The tunnel mode is docker-compose.tunnel.yaml on
  # top of this file, which switches it on for every `up`; `--profile
  # tunnel` does the same for one command.
  cloudflared:
    profiles: ["tunnel"]
    # Pinned by digest, as every image here is. Its entrypoint is
    # `cloudflared --no-autoupdate`: a release arrives by moving the
    # digest, never by the container replacing its own binary.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # `tunnel run` with neither a name nor a config file: the token names
    # the tunnel, and the dashboard gives it its routes.
    #
    # The metrics server on the container's loopback, where the
    # healthcheck asks. The image binds it to every interface, which here
    # would be `edge` and the way out: /metrics, the tunnel's routes at
    # /config and /debug/pprof, for `web` or anything else there to read.
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      # Empty when unset, and then cloudflared refuses to start, saying
      # it needs the ID or name of the tunnel to run, and the restart
      # policy tries again. A `${TUNNEL_TOKEN:?...}` would refuse every
      # compose command instead, the tunnel's or not, as it did for the
      # collector's token. In the environment, never on the command
      # line, which any user on the host can read.
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    # `edge` to reach `web`, a network of its own to reach Cloudflare,
    # and nothing else: not `default`, where the collector is.
    networks: [edge, cloudflared-egress]
    healthcheck:
      # The metrics server's /ready: 200 while a connection to
      # Cloudflare's edge is up, 503 when none is. The image has no shell
      # and no curl; `cloudflared tunnel ready` asks it, and exits
      # non-zero on anything but a 200.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  # The site (#128): the page, its reads of the dataset, the chat, on
  # DeepSeek, the weekly Parquet export, and /healthz, from one
  # `chatsbom web serve` in the image Dockerfile.web builds. The tunnel
  # routes the site's hostname to `http://web:8080` (DEPLOY.md).
  #
  #   docker compose up -d              start
  #   docker compose logs -f web        watch
  #
  # No profile: serving the page spends nothing, and a bare `up` is what
  # serves it. It does not start without ALTCHA_HMAC_KEY and a published
  # snapshot, and says which in its log until both are there; nor does
  # compose create it without data/snapshots and data/export, below.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: web
    # docker-init as PID 1, handing uvicorn the stop signal, as for the
    # others: the kernel drops one PID 1 has no handler for.
    init: true
    environment:
      # Its settings, from `.env`, empty when unset: the service takes
      # its own default for a setting that is empty, and does not start
      # without one it needs, ALTCHA_HMAC_KEY, saying which in `docker
      # compose logs web`. A `${...:?}` would refuse every compose
      # command instead, the other services' included. `.env.example`
      # says what each is.
      ALTCHA_HMAC_KEY: "${ALTCHA_HMAC_KEY:-}"
      CHAT_RATE_LIMIT: "${CHAT_RATE_LIMIT:-}"
      QUERY_RATE_LIMIT: "${QUERY_RATE_LIMIT:-}"
      EXPORT_RATE_LIMIT: "${EXPORT_RATE_LIMIT:-}"
      DAILY_SPEND_CAP_USD: "${DAILY_SPEND_CAP_USD:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      CHAT_MODEL: "${CHAT_MODEL:-}"
      CHAT_MAX_IN_FLIGHT: "${CHAT_MAX_IN_FLIGHT:-}"
      CHAT_INPUT_USD_PER_MTOK: "${CHAT_INPUT_USD_PER_MTOK:-}"
      CHAT_CACHED_INPUT_USD_PER_MTOK: "${CHAT_CACHED_INPUT_USD_PER_MTOK:-}"
      CHAT_OUTPUT_USD_PER_MTOK: "${CHAT_OUTPUT_USD_PER_MTOK:-}"
      CHAT_OFF_PEAK_INPUT_USD_PER_MTOK: "${CHAT_OFF_PEAK_INPUT_USD_PER_MTOK:-}"
      CHAT_OFF_PEAK_CACHED_INPUT_USD_PER_MTOK: "${CHAT_OFF_PEAK_CACHED_INPUT_USD_PER_MTOK:-}"
      CHAT_OFF_PEAK_OUTPUT_USD_PER_MTOK: "${CHAT_OFF_PEAK_OUTPUT_USD_PER_MTOK:-}"
      CHAT_PEAK_HOURS: "${CHAT_PEAK_HOURS:-}"
      # The edge's subnet, one setting for the network, below, and for
      # the service, which believes CF-Connecting-IP from a peer there:
      # only cloudflared can be one. Never empty here, which would key
      # every visitor through the tunnel as cloudflared.
      EDGE_SUBNET: "${EDGE_SUBNET:-172.16.128.0/24}"
      # Where the volume, the snapshots and the export are mounted,
      # below: compose's to say. In `.env` these three name the host's
      # paths, for a `web serve` run there.
      WEB_STATE_DIR: /app/state
      WEB_SNAPSHOT: /app/data/snapshots
      WEB_EXPORT_DIR: /app/data/export
      # As the collector's: JSON, one object per line on stderr, for
      # whatever collects the logs.
      CHATSBOM_LOG_FORMAT: json
    volumes:
      # web.sqlite: the day's spend, and the challenges used. Kept by a
      # recreate, `up --build` included, where the container's own layer
      # would have reset the day's cap; `docker compose down -v` clears
      # it.
      - web-sqlite:/app/state
      # The snapshots, where the CLI publishes them. CURRENT is read as
      # each question starts, so a new snapshot is served without a
      # restart. Read-only: what serves the page cannot change what it
      # serves. And never made by Docker: it makes a missing source,
      # owned by root, where the CLI, run as you, could then publish
      # nothing. Without it the start is refused, naming the path.
      - type: bind
        source: ./data/snapshots
        target: /app/data/snapshots
        read_only: true
        bind:
          create_host_path: false
      # The weekly Parquet export, where the collector writes it, served
      # at /export/ as it is found (#154): read-only, and never made by
      # Docker, for the same reasons. The collector makes it as it
      # starts, before its first export.
      - type: bind
        source: ./data/export
        target: /app/data/export
        read_only: true
        bind:
          create_host_path: false
    # `edge`, where cloudflared reaches it, and `default`, its way out to
    # DeepSeek's API, since `edge` leads nowhere. No port: in either mode
    # the tunnel is its way in from off this machine.
    networks: [default, edge]
    # A web process that writes one file, in its volume: a read-only
    # root, and /tmp, bounded, for what Python and SQLite put there; no
    # capability, and no way to gain one.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Its check is the image's own, asking /healthz from inside it
    # (Dockerfile.web). An event loop that stalls exits the process,
    # and this starts it again.
    restart: unless-stopped
    # uvicorn stops once what is in flight is answered, and an answer
    # streams for as long as its turns take: Docker's 10 s would cut
    # most of them off. 30 s is what cloudflared gives the requests it
    # carries when it stops.
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0

  # A one-shot shell in the same image, for running a stage by hand:
  #
  #   docker compose run --rm cli queue status
  #   docker compose run --rm cli warehouse build
  #
  # Same image and mounts as the collector, so a manual stage and the
  # loop see identical state.
  cli:
    profiles: ["tools"]
    # The collector's image, and so the collector's build; see there.
    image: ${COMPOSE_PROJECT_NAME}-collector
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    # As for `resolver`: chatsbom as PID 1 would ignore the TERM a stop
    # sends.
    init: true
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # As the collector has it, for `github depgraph` and `run` by hand.
      CHATSBOM_DEPGRAPH_API: "${CHATSBOM_DEPGRAPH_API:-auto}"
      CHATSBOM_DEPGRAPH_TOKENS: "${CHATSBOM_DEPGRAPH_TOKENS:-}"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.requests-cache:/app/.requests-cache

networks:
  # The nested daemon and `resolver`, and nothing else: not `web`, not
  # the collector. Not `internal`, since the daemon pulls the images a
  # pass runs over it, before the pass resolves anything. No resolution
  # is on it: each runs on an internal network of the daemon's own,
  # whose one way out is its proxy, to the recipe's registries alone
  # (chatsbom/core/sandbox.py).
  sandbox:
  # `cloudflared` and `web`, and nothing else: the tunnel's way to the
  # site, and the only way to it from off this machine.
  #
  # Internal, so it leads nowhere beyond them. Isolated, so its bridge
  # has no address on the host either: an internal network otherwise has
  # one, and then a process on the host reaches `web` from an address
  # in this network, where only the tunnel should be, and the containers
  # reach whatever the host serves on all its interfaces. `isolated`
  # needs Docker Engine 28.0 or newer, which refuses it on a network that
  # is not internal.
  edge:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    # A subnet of its own, which `web` is told as EDGE_SUBNET: it
    # believes CF-Connecting-IP from a peer there (#139). Docker would
    # otherwise choose one, another on each machine and after each
    # `down`, which nothing could name.
    #
    # 172.16.128.0/24 is private, and in none of the pools Docker gives
    # a network its subnet from: 172.17 to 172.31 and 192.168, and 10/8
    # for swarm's overlays. In one of them, a network Docker made first
    # for another project could hold it, and `up` would fail on the
    # overlap. Isolated, the host has no route to it, so a LAN on the
    # same range stays reachable from the host; only the containers on
    # `edge` would not reach it, and they need no LAN.
    #
    # To move it, set EDGE_SUBNET in `.env` to one IPv4 subnet: the
    # network and `web` both take it, and the next `up` makes the
    # network again, stopping what is on it for a moment (DEPLOY.md).
    ipam:
      config:
        - subnet: "${EDGE_SUBNET:-172.16.128.0/24}"
  # The tunnel's way out, to Cloudflare, and nobody else's. `web` goes
  # out to DeepSeek's API over `default`, beside the collector.
  cloudflared-egress:

volumes:
  # The nested daemon's image cache. A named volume rather than a bind
  # mount: it holds overlay2 layers, which need a real filesystem.
  dind-storage:
  # The nested daemon's client certificate, which it writes and
  # `resolver` alone reads. Named, so that Docker fills it from the image's
  # /certs/client, which is mode 1777: the daemon runs rootless, and a
  # directory made by Docker would be root's.
  dind-certs:
  # The web service's web.sqlite: the day's spend, and the challenges
  # used. A named volume rather than a bind mount: Docker fills it from
  # the image's /app/state, owned by the service's uid, where a host
  # directory would be owned by whoever made it.
  web-sqlite:
