# The tunnel mode: `cloudflared`, a service of this project, is the way
# in, and starts with every `up`. Compose reads this on top of
# docker-compose.yaml when `.env` names both:
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.tunnel.yaml
#   TUNNEL_TOKEN=<the tunnel's token>
#
# Run compose from the directory that `.env` is in, as everything here
# does: compose takes COMPOSE_FILE from the directory it runs in, and
# from anywhere else finds docker-compose.yaml alone, whose `up` leaves
# the tunnel off. A docker-compose.override.yaml of your own goes last
# in the list, since with COMPOSE_FILE set compose reads only the files
# it names.
#
# One change and nothing else (compose_test): `up` starts `cloudflared`,
# as `--profile tunnel` has one command do. `!reset` is compose's way to
# take a setting away, here the profile that keeps it off.
services:
  cloudflared:
    profiles: !reset []
